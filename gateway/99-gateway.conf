# Va en /etc/sysctl.d/99-gateway.conf
#
# Un archivo propio en /etc/sysctl.d/ en vez de editar /etc/sysctl.conf. Es la
# misma idea que la tabla aparte de nftables: para dar marcha atrás se borra un
# archivo, y no hay que acordarse de qué línea era tuya en un archivo del
# sistema que además puede cambiar con una actualización.
#
#   sudo cp 99-gateway.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Para revertir:
#
#   sudo rm /etc/sysctl.d/99-gateway.conf && sudo sysctl --system

# Reenviar paquetes que no son para esta máquina. Es LO que convierte un
# equipo cualquiera en un router, y sin esto todo lo demás (el NAT, las rutas,
# el DHCP) está bien configurado y no pasa nada.
net.ipv4.ip_forward = 1

# IPv6 queda apagado a propósito, y es una decisión y no un olvido.
#
# Si lo prendés, los equipos de la casa reciben direcciones IPv6 públicas y
# salen SIN pasar por el NAT: quedan accesibles desde internet salvo que la
# cadena de forward esté igual de bien escrita para v6, y todo lo que mires en
# el panel va a ser la mitad de la historia, porque la otra mitad va por un
# camino que no estás filtrando.
#
# Prendelo recién cuando el v4 esté andando y probado, y ese mismo día revisá
# la cadena forward de la tabla `gateway`.
net.ipv6.conf.all.forwarding = 0

# No aceptar redirecciones ICMP. Un router no las necesita, y aceptarlas deja
# que cualquiera en la red le cambie las rutas mandando un paquete.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Filtro de ruta inversa en modo estricto: descarta paquetes cuya IP de origen
# no correspondería a la interfaz por la que llegaron. Corta el spoofing más
# simple, que es alguien en la LAN mandando paquetes con una IP de internet
# como origen.
#
# OJO si algún día tenés dos salidas a internet: con dos proveedores el ruteo
# asimétrico es normal y este valor tira tráfico bueno. Ahí va en 2 (modo
# laxo), no en 0.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
