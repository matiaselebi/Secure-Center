# Va en /etc/dnsmasq.d/gateway.conf
#
# El DHCP de la casa. Lo da el mismo dnsmasq que ya usa Pi-hole, y eso no es
# casualidad ni ahorro: es lo que hace que cada equipo reciba, en el mismo
# paquete, la IP del router Y la del DNS filtrado. Dos servidores separados
# darían dos oportunidades de que un equipo salga con el DNS del proveedor.
#
#   sudo cp dnsmasq-gateway.conf /etc/dnsmasq.d/gateway.conf
#   sudo systemctl restart pihole-FTL
#
# Para revertir:  sudo rm /etc/dnsmasq.d/gateway.conf
#                 sudo systemctl restart pihole-FTL
#                 (y volvé a prender el DHCP del router del proveedor)

# El rango que se reparte. Arranca en .100 a propósito: de .2 a .99 queda
# libre para direcciones fijas (la impresora, el NAS, la cámara), que es lo
# que después vas a querer y no vas a poder si el DHCP ya las repartió.
dhcp-range=192.168.50.100,192.168.50.199,12h

# La puerta de enlace: esta máquina.
dhcp-option=option:router,192.168.50.1

# El DNS: esta máquina también, que es donde está Pi-hole con SecureDNS
# arriba. Se pone explícito y no se confía en el default, porque el default es
# "el que dio la IP" y eso deja de ser cierto el día que alguien cambie algo.
dhcp-option=option:dns-server,192.168.50.1

# Sin servidor de tiempo ni WINS ni nada más. Cada opción que se manda es una
# cosa más que puede estar mal y que hay que mantener.

# El nombre del dominio local, para que los equipos se vean por nombre.
domain=casa.lan
local=/casa.lan/
