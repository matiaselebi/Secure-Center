#!/usr/sbin/nft -f
#
# Tabla del gateway. Va en /etc/nftables.d/gateway.conf
#
# ================== POR QUÉ ESTO ES UNA TABLA APARTE ==================
#
# La regla número uno de la suite es que hay UN solo dueño del firewall, y ese
# es SecureHIPS. Este archivo no la rompe, y el mecanismo por el que no la
# rompe es concreto: nftables evalúa cada tabla de forma independiente.
#
# SecureHIPS vive en `inet securehips` y tiene sus cadenas de input, output y
# forward. Esto vive en `inet gateway` y solo hace NAT y la política de
# reenvío. Ninguno de los dos borra ni pisa las reglas del otro, y cada uno se
# saca entero con un solo comando.
#
# Con iptables esto era imposible: había una sola cadena FORWARD, todos
# escribían ahí, y el último que corría pisaba al anterior. Esa es la razón de
# fondo por la que la suite usa nft y no iptables.
#
# ================== LO QUE ESTE ARCHIVO NO HACE ==================
#
# No bloquea IPs. Los bloqueos son de SecureHIPS, que ya tiene su cadena de
# forward mirando los mismos sets: una IP bloqueada desde el panel queda
# cortada también para el celular y para el televisor, sin que haya que
# repetir nada acá.
#
# ================== ANTES DE APLICARLO ==================
#
#   1. Cambiá WAN y LAN abajo por los nombres reales (los ves con `ip link`).
#   2. Cambiá la red de la LAN si no usás 192.168.50.0/24.
#   3. Probá la sintaxis SIN aplicar:  sudo nft -c -f gateway.conf
#   4. Aplicá:                          sudo nft -f gateway.conf
#
# Para sacarlo, es un comando y no deja nada:
#
#   sudo nft delete table inet gateway
#
# ======================================================================

define WAN = "eth0"          # la que va al módem / a internet
define LAN = "eth1"          # la que va al switch de la casa
define RED_LAN = 192.168.50.0/24

table inet gateway {

    # ---------------------------------------------------- LOS CONTADORES
    # Con nombre y declarados acá arriba, para que se puedan leer sin tener
    # que adivinar a qué regla corresponde cada número.
    #
    # Son la única forma de contestar "¿está pasando algo por acá?" con un
    # dato en vez de con una impresión, y son LO que se mira en la fase 2,
    # cuando estás probando con un solo equipo:
    #
    #   sudo nft list counters table inet gateway
    #
    # Si `reenviados` no se mueve mientras el equipo de prueba navega, el
    # tráfico no está pasando por acá: está saliendo por el router viejo.
    # Si `descartados` sube rápido, algo que vos querés está siendo cortado.
    counter reenviados { }
    counter descartados { }

    # ------------------------------------------------------------- NAT
    # Sin esto, los paquetes salen con la IP privada del celular como origen
    # y no vuelven nunca: el mundo no sabe rutear a 192.168.50.x.
    #
    # `masquerade` y no `snat` a una IP fija: la dirección que da el proveedor
    # cambia, y con snat habría que reescribir esta regla cada vez.
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr $RED_LAN masquerade
    }

    # --------------------------------------------------------- REENVÍO
    # La política es DROP. Es lo único de este archivo que decide seguridad, y
    # por eso está escrito así y no al revés: con `policy accept`, cualquier
    # red mal configurada que llegue a esta máquina sale a internet por acá.
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Lo que ya está establecido vuelve. Va PRIMERO y es lo más importante
        # de la cadena: sin esta línea, las respuestas de internet a un pedido
        # del celular caen en el drop y no anda absolutamente nada. Es el error
        # clásico y da un síntoma engañoso, porque el ping puede llegar a andar
        # mientras la navegación no.
        ct state established,related accept

        # Lo que sale de la casa hacia internet.
        iifname $LAN oifname $WAN counter name "reenviados" accept

        # Entre equipos de la misma LAN, por si en algún momento hay más de
        # una interfaz interna. Con un solo cable no hace nada.
        iifname $LAN oifname $LAN accept

        # Lo que venga de internet hacia adentro sin haber sido pedido se cae
        # por la política. No hay una regla que lo diga: la ausencia de regla
        # ES la decisión, y agregar un `drop` explícito acá haría creer que sin
        # esa línea pasaría.

        # Lo que llegó hasta acá se lo lleva la política de drop. El contador
        # no cambia el comportamiento: es lo que permite contestar "¿esto está
        # cortando algo que yo quería?" con un número.
        counter name "descartados"
    }
}
